name: 알림 보내기

on:
  schedule:
    # UTC 22:00 = 한국 시간 아침 7시
    - cron: '0 22 * * *'

  # 직접 보낼 때는 이 화면에서 제목과 내용을 적는다
  workflow_dispatch:
    inputs:
      title:
        description: '제목 (비워두면 오늘 일정을 자동으로 보냅니다)'
        required: false
      body:
        description: '내용'
        required: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install web-push --no-save

      - name: 알림 전송
        working-directory: class-schedule
        run: node scripts/push.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_BODY: ${{ inputs.body }}
