name: 일정 알림

on:
  schedule:
    # UTC 22:00 = 한국 시간 아침 7시
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 화면에서 직접 눌러 테스트할 때 사용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 알림 보내기
        run: node scripts/notify.js
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
